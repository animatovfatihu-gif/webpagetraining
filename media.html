<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section id="media" class="section media container">
      <div class="section-head center reveal">
        <h2 class="title-anim">Training & Media</h2>
        <p class="muted">Webinars, tutorials and community highlights to help you grow.</p>
      </div>

      <div class="row reveal" style="margin-top:12px; align-items:flex-start">
        <div style="flex:1; min-width:280px">
          <div class="video-wrap">
            <video controls poster="https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=1200&auto=format&fit=crop&s=placeholder">
              <source src="video-training.mp4" type="video/mp4">
              Your browser doesn't support HTML5 video.
            </video>
          </div>
        </div>

        <div style="flex:1; min-width:220px;">
          <p class="muted">Recent sessions and community highlights:</p>
          <div class="media-grid">
            <img src="https://images.unsplash.com/photo-1556157382-97eda2d62296?q=80&w=800&auto=format&fit=crop&s=placeholder" alt="webinar preview">
            <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=800&auto=format&fit=crop&s=placeholder" alt="seminar preview">
            <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?q=80&w=800&auto=format&fit=crop&s=placeholder" alt="team meeting preview">
          </div>
        </div>
      </div>
    </section>
</body>
</html>
